<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Monitor — Dashboard</title>
  
  <!--
    Machine Monitor Dashboard
    Uses React via CDN (no build step needed).
    Socket.io client connects to the server for real-time updates.
  -->
  
  <!-- React 18 (production, minified) from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX transformation (in-browser, fine for Phase 1) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Socket.io client -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- React mounts into this div -->
  <div id="root"></div>
  
  <!-- Application scripts (JSX, transformed by Babel in-browser) -->
  <script type="text/babel" src="js/AgentCard.js"></script>
  <script type="text/babel" src="js/Dashboard.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
